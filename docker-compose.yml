# Base de datos PostgreSQL para desarrollo. Arranca con: npm run db:up
services:
  db:
    image: postgres:16
    container_name: soporteweb-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: soporte_web
      POSTGRES_PASSWORD: soporte_dev
      POSTGRES_DB: soporte_web
    ports:
      - "5433:5432"
    volumes:
      - soporte_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soporte_web -d soporte_web"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  soporte_pg_data: